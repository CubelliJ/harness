name: Auto-merge Release PR

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'release-please--branches--develop--')
    runs-on: ubuntu-latest
    steps:
      - name: Merge the tested Release Please PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base develop \
            --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--branches--develop--")) | .number' \
            | head -n 1)"

          if [ -z "$pr_number" ]; then
            echo "No open Release Please PR targeting develop."
            exit 0
          fi

          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch
