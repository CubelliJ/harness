name: Auto-merge Release PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-release:
    if: >-
      github.event.pull_request.base.ref == 'develop' &&
      startsWith(github.event.pull_request.head.ref, 'release-please--branches--develop--')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for the Release Please PR
        env:
          # Use a token whose merge push can trigger the release workflow.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --delete-branch
