name: Release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the release pull request
        id: release-pr
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: develop

      # Merge in this same job, then tag below. Do not rely on a follow-up
      # push workflow: GitHub suppresses events from GITHUB_TOKEN merges, so
      # a separate auto-merge never creates the tag.
      - name: Merge the release pull request
        if: ${{ steps.release-pr.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.release-pr.outputs.pr && fromJSON(steps.release-pr.outputs.pr).number || '' }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch

      - name: Create the version tag and GitHub Release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: develop
          skip-github-pull-request: true
