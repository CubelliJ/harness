[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-cli"
version = "0.22.1"
description = "CLI coding agent"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Joaquin Cubelli"}]
dependencies = []

[project.scripts]
harness = "harness.main:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["native/stt/*"]
